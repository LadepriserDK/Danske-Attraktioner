<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Danske Attraktioner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1720">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1720; --panel:#151E28; --panel2:#1C2733; --line:#2A3644;
  --text:#EEF3F8; --muted:#8A9AAB; --accent:#4DADE5; --ok:#3BD37F; --warn:#F2B740;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- KORT ---------- */
.mapwrap{position:relative;flex:none;height:38vh;min-height:200px}
#map{width:100%;height:100%;background:#0D3D5C}
.leaflet-control-attribution{font-size:9px}
.mapbtns{position:absolute;right:10px;top:10px;z-index:500;
  display:flex;flex-direction:column;gap:8px}
.mapbtn{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:rgba(21,30,40,.94);color:var(--text);font-size:19px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.45);
}
.mapbtn.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.toast{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(8px);
  z-index:600;max-width:82%;
  background:rgba(21,30,40,.96);border:1px solid var(--accent);
  color:var(--text);font-size:13px;font-weight:600;
  padding:10px 16px;border-radius:99px;text-align:center;
  box-shadow:0 3px 14px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- RADIUS ---------- */
.radiusbar{
  display:flex;align-items:center;gap:12px;
  margin:9px 10px 4px;padding:10px 14px;flex:none;
  background:var(--panel);
  border:2px solid var(--ok);border-radius:var(--r);
  transition:border-color .2s, opacity .2s;
}
.radiusbar.off{border-color:var(--line);opacity:.4}
.radiusbar label{font-size:13px;color:var(--muted);flex:none}
.radiusbar input[type=range]{flex:1;accent-color:var(--accent);height:30px}
.radiusbar output{font-size:16px;font-weight:700;min-width:66px;text-align:right}

/* ---------- TITEL ---------- */
.titlebar{display:flex;align-items:center;gap:8px;padding:6px 14px 9px;flex:none}
.titlebar h1{font-size:16px;font-weight:700}
.titlebar .sub{font-size:11px;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.iconbtn{
  width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-size:17px;cursor:pointer;transition:all .15s;
}
.iconbtn.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);background:rgba(59,211,127,.12)}

/* ---------- SØGERÆKKE ---------- */
.searchrow{display:none;gap:8px;padding:0 10px 9px;flex:none}
.searchrow.show{display:flex}
.searchrow input{
  flex:1;padding:12px 14px;border:2px solid var(--accent);border-radius:var(--r);
  background:var(--panel);color:var(--text);font-size:16px;font-family:inherit;
}
.searchrow input::placeholder{color:var(--muted)}
.searchrow button{
  width:46px;flex:none;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel2);color:var(--text);font-size:17px;cursor:pointer;
}

/* ---------- FILTRE ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px;flex:none}
.filters:empty{display:none}
.fchip{font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px;
  background:rgba(77,173,229,.18);color:var(--accent);cursor:pointer;
  display:flex;align-items:center;gap:5px}
.fchip b{font-weight:800;font-size:13px;line-height:1}

/* ---------- LISTE ---------- */
.listhead{display:flex;align-items:baseline;gap:8px;padding:0 14px 9px;flex:none}
.listhead b{font-size:15px}
.listhead span{font-size:12px;color:var(--muted)}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 10px 30px;-webkit-overflow-scrolling:touch}
.card{display:flex;align-items:center;gap:12px;padding:9px;margin-bottom:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.card:active{border-color:var(--accent)}
.thumbwrap{width:66px;height:66px;flex:none;position:relative}
.thumb{
  width:100%;height:100%;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel2);
}
.thumb>img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-size:10px;font-weight:700;line-height:1.2;text-align:center;
  padding:4px;word-break:break-word}
.badge-ok{position:absolute;top:0;right:0;background:var(--ok);color:#06210F;
  font-size:11px;font-weight:800;width:20px;height:20px;display:flex;
  align-items:center;justify-content:center;border-bottom-left-radius:8px;
  border-top-right-radius:10px;z-index:2}
.cardbody{flex:1;min-width:0}
.cardbody .nm{font-size:15px;font-weight:600;line-height:1.25;margin-bottom:3px}
.cardbody .mt{font-size:12px;color:var(--muted)}
.cardbody .tags{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.tag.free{background:rgba(59,211,127,.15);color:var(--ok)}
.carddist{font-size:13px;font-weight:600;color:var(--muted);flex:none;text-align:right}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}

/* ---------- ARK ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:3000;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheetbox{width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);
  border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));
  animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheethead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheethead h2{font-size:19px;font-weight:700;line-height:1.25;flex:1}
.closebtn{width:34px;height:34px;flex:none;border:none;border-radius:50%;
  background:var(--panel2);color:var(--text);font-size:17px;cursor:pointer}
.seclabel{font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.09em;font-weight:600;margin:18px 0 9px}
.seclabel:first-of-type{margin-top:0}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.regbtn{padding:13px 8px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel2);color:var(--text);font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer}
.regbtn.on{background:var(--accent);border-color:var(--accent);color:#08131C}
.regbtn small{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:3px}
.wide{width:100%;padding:13px;margin-top:9px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel2);color:var(--text);
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.wide.on{background:var(--accent);border-color:var(--accent);color:#08131C}
.hero{
  width:100%;height:200px;border-radius:var(--r);background:var(--panel2);
  overflow:hidden;margin-bottom:14px;display:flex;
  align-items:center;justify-content:center;
}
.hero>img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;
  background:rgba(77,173,229,.16);color:var(--accent)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px}
.fact .k{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.fact .v{font-size:14px;font-weight:600}
.btnrow{display:flex;gap:9px;margin-top:10px}
.btn{flex:1;padding:14px;border:none;border-radius:var(--r);background:var(--accent);
  color:#08131C;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  text-align:center;text-decoration:none;display:block}
.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.drop{padding:22px;border:2px dashed var(--line);border-radius:var(--r);
  text-align:center;font-size:13px;color:var(--muted);cursor:pointer}
.gallery{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:9px}
.gallery div{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel2);position:relative}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery .lock{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);
  font-size:10px;text-align:center;padding:2px}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:9px}
#camInput{display:none}
@media(min-width:900px){.mapwrap{height:52vh}.list{padding:0 20px 30px}}
</style>
</head>
<body>

<div class="mapwrap">
  <div id="map"></div>
  <div class="mapbtns">
    <div class="mapbtn" id="locBtn" title="Sæt punkt på min position">⌖</div>
    <div class="mapbtn" id="pinBtn" title="Sæt punkt et andet sted">📍</div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<div class="radiusbar" id="radiusBar">
  <label>Radius</label>
  <input type="range" id="radius" min="5" max="150" value="50" step="5">
  <output id="radiusOut">50 km</output>
</div>

<div class="titlebar">
  <div>
    <h1>🗺️ Danske Attraktioner</h1>
    <div class="sub" id="progress">–</div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="searchBtn" title="Søg">🔍</button>
  <button class="iconbtn" id="allBtn" title="Vis alle">🌍</button>
  <button class="iconbtn" id="setBtn" title="Indstillinger">⚙️</button>
</div>

<div class="searchrow" id="searchRow">
  <input type="text" id="search" placeholder="Søg navn, by eller kategori…">
  <button id="searchClose">✕</button>
</div>

<div class="filters" id="filters"></div>

<div class="listhead">
  <b id="listTitle">Attraktioner i området</b>
  <span id="listCount"></span>
</div>

<div class="list" id="list"></div>

<!-- INDSTILLINGER -->
<div class="sheet" id="setSheet">
  <div class="sheetbox">
    <div class="sheethead">
      <h2>Indstillinger</h2>
      <button class="closebtn" data-close="setSheet">✕</button>
    </div>

    <div class="seclabel">Landsdel</div>
    <div class="regions" id="regions"></div>
    <button class="wide" id="clearReg">Vis alle landsdele</button>

    <div class="seclabel">Visning</div>
    <button class="wide" id="onlyMissing">Vis kun dem jeg mangler</button>

    <div class="seclabel">Min status</div>
    <div class="facts" id="statFacts"></div>

    <div class="seclabel">Billeder</div>
    <button class="wide" id="reloadImgs">Hent billeder forfra</button>

    <div class="note" id="imgNote"></div>
  </div>
</div>

<!-- DETALJE -->
<div class="sheet" id="detSheet">
  <div class="sheetbox">
    <div class="sheethead">
      <div style="flex:1">
        <h2 id="dName"></h2>
        <div class="chips" id="dChips"></div>
      </div>
      <button class="closebtn" data-close="detSheet">✕</button>
    </div>

    <div id="dHeroWrap"></div>

    <div class="facts">
      <div class="fact"><div class="k">By</div><div class="v" id="dCity">–</div></div>
      <div class="fact"><div class="k">Afstand</div><div class="v" id="dDist">–</div></div>
      <div class="fact"><div class="k">Adgang</div><div class="v" id="dPrice">–</div></div>
      <div class="fact"><div class="k">Landsdel</div><div class="v" id="dReg">–</div></div>
    </div>

    <div class="btnrow">
      <a class="btn" id="dRoute" target="_blank" rel="noopener">🚗 Rute</a>
      <a class="btn alt" id="dWeb" target="_blank" rel="noopener">🌐 Info</a>
    </div>
    <div class="btnrow">
      <button class="btn alt" id="dImg">🖼️ Skift billede</button>
    </div>

    <div class="seclabel">Mine fotos</div>
    <div class="gallery" id="dGallery"></div>
    <div class="drop" id="dDrop">📸 Tag foto på stedet</div>
    <div class="note" id="dGeoNote"></div>

    <div class="btnrow">
      <button class="btn alt" id="dVisit">Markér som besøgt</button>
    </div>
  </div>
</div>

<input type="file" id="camInput" accept="image/*" capture="environment">

function km(a,b,c,d){
  const R=6371, p=Math.PI/180;
  const dLa=(c-a)*p, dLo=(d-b)*p;
  const x=Math.sin(dLa/2)**2 + Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLo/2)**2;
  return R*2*Math.asin(Math.sqrt(x));
}

   Hentes i tre forsøg: dansk Wikipedia → engelsk Wikipedia → Wikimedia Commons.
   Du kan altid overskrive med din egen billed-URL i detaljearket.        */
const OWN = () => JSON.parse(localStorage.getItem('ownimg') || '{}');
function imgFor(a){ return OWN()[a.id] || PHOTOS[a.id] || ''; }

async function wikiBatch(host, pairs){
  // pairs: [{id, title}] – returnerer {id: url}
  const res = {};
  for (let i = 0; i < pairs.length; i += 40){
    const part = pairs.slice(i, i + 40);
    try{
      const url = 'https://' + host + '/w/api.php?action=query&format=json'
        + '&origin=*&redirects=1&prop=pageimages&piprop=thumbnail'
        + '&pithumbsize=480&pilimit=50&titles='
        + encodeURIComponent(part.map(p => p.title).join('|'));
      const j = await (await fetch(url)).json();
      const q = j.query || {};
      const src = {};
      Object.values(q.pages || {}).forEach(p => { if (p.thumbnail) src[p.title] = p.thumbnail.source; });
      const alias = {};
      (q.normalized || []).forEach(n => alias[n.from] = n.to);
      (q.redirects  || []).forEach(r => alias[r.from] = r.to);
      part.forEach(p => {
        let t = p.title, g = 0;
        while (alias[t] && g++ < 5) t = alias[t];
        if (src[t]) res[p.id] = src[t];
      });
    }catch(e){}
  }
  return res;
}

async function commonsSearch(a){
  try{
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*'
      + '&generator=search&gsrnamespace=6&gsrlimit=1&prop=imageinfo'
      + '&iiprop=url&iiurlwidth=480&gsrsearch='
      + encodeURIComponent(a.name + ' ' + a.city.split(',')[0]);
    const j = await (await fetch(url)).json();
    const pages = (j.query || {}).pages || {};
    const p = Object.values(pages)[0];
    const ii = p && p.imageinfo && p.imageinfo[0];
    return (ii && (ii.thumburl || ii.url)) || '';
  }catch(e){ return ''; }
}

async function loadPhotos(){
  PHOTOS = JSON.parse(localStorage.getItem('wikiimg') || '{}');
  let missing = ATTRACTIONS.filter(a => !PHOTOS[a.id]);
  if (!missing.length){ noteImages(); return; }

  // 1) dansk Wikipedia
  const da = await wikiBatch('da.wikipedia.org',
    missing.filter(a => a.wiki).map(a => ({id:a.id, title:a.wiki})));
  Object.assign(PHOTOS, da);
  save();

  // 2) engelsk Wikipedia
  missing = ATTRACTIONS.filter(a => !PHOTOS[a.id] && a.en);
  if (missing.length){
    const en = await wikiBatch('en.wikipedia.org',
      missing.map(a => ({id:a.id, title:a.en})));
    Object.assign(PHOTOS, en);
    save();
  }

  // 3) Wikimedia Commons, ét ad gangen for de sidste få
  missing = ATTRACTIONS.filter(a => !PHOTOS[a.id]);
  for (const a of missing.slice(0, 25)){
    const u = await commonsSearch(a);
    PHOTOS[a.id] = u || '';
  }
  save();

  ATTRACTIONS.forEach(a => { if (!(a.id in PHOTOS)) PHOTOS[a.id] = ''; });
  save(); noteImages(); render();

  function save(){ try{ localStorage.setItem('wikiimg', JSON.stringify(PHOTOS)); }catch(e){} }
}

function noteImages(){
  const own = OWN();
  const have = ATTRACTIONS.filter(a => own[a.id] || PHOTOS[a.id]).length;
  document.getElementById('imgNote').innerHTML =
    'Fotos hentes fra Wikipedia og Wikimedia Commons og gemmes lokalt — '
    + have + ' af ' + ATTRACTIONS.length + ' har et billede.<br><br>'
    + 'Mangler et billede, kan du selv indsætte et: åbn attraktionen og tryk '
    + '"Skift billede". Dit eget billede bruges frem for det hentede.<br><br>'
    + '<b>Adgang</b> er angivet efter type, ikke efter kontrollerede priser: '
    + '"Fri adgang" er steder uden port eller billetsalg, "Billet – se info" '
    + 'er steder med operatør. Tryk Info for den aktuelle pris.';
}

/* Fylder et felt med billede. Fejler URL'en, vises kategorinavnet
   i stedet — aldrig browserens brudte-billede-ikon.                */
function fillThumb(box, a, isHero){
  const ph = () => {
    box.innerHTML = '';
    const s = document.createElement('span');
    if (isHero){
      s.textContent = 'Intet foto — tryk "Skift billede"';
      s.style.cssText = 'font-size:13px;color:var(--muted);text-align:center;padding:0 20px';
      box.classList.add('none');
    } else {
      s.className = 'ph';
      s.style.color = col(a.cat);
      s.textContent = a.cat;
    }
    box.appendChild(s);
  };

  let url = imgFor(a);
  if (url && url.startsWith('http://')) url = 'https://' + url.slice(7);
  if (!url){ ph(); return; }

  ph();                                   // pladsholder mens der hentes
  const im = new Image();
  im.alt = a.name;
  im.decoding = 'async';
  im.onload  = () => {
    box.classList.remove('none');
    box.innerHTML = '';
    box.appendChild(im);
  };
  im.onerror = () => { markBad(a.id); ph(); };
  im.src = url;
}

function markBad(id){
  if (PHOTOS[id]){
    PHOTOS[id] = '';
    try{ localStorage.setItem('wikiimg', JSON.stringify(PHOTOS)); }catch(e){}
  }
}

/* ---------- besked over kortet ---------- */
let toastTimer = null;
function toast(msg, sticky){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function hideToast(){
  clearTimeout(toastTimer);
  document.getElementById('toast').classList.remove('show');
}

/* ---------- kort ---------- */
function initMap(){
  map = L.map('map',{zoomControl:false, touchZoom:true, doubleClickZoom:true,
    scrollWheelZoom:true, dragging:true, tap:true}).setView(centre, 8);
  L.control.zoom({position:'topleft'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  markers = L.layerGroup().addTo(map);

  // et tryk hvor som helst på kortet flytter punktet dertil
  map.on('click', e => {
    movePin([e.latlng.lat, e.latlng.lng], false);
    if (pinMode){
      pinMode = false;
      document.getElementById('pinBtn').classList.remove('on');
    }
    toast('Punkt sat — afstande måles herfra');
  });
}

/* gul nål = min position · rød nål = punkt jeg selv har sat */
function pinIcon(onMe){
  const fill = onMe ? '#F2B740' : '#E5484D';
  const dot  = onMe ? '#0F1720' : '#FFFFFF';
  return L.divIcon({className:'',iconSize:[30,38],iconAnchor:[15,36],html:
    `<svg width="30" height="38" viewBox="0 0 30 38">
       <path d="M15 37C15 37 28 22 28 14A13 13 0 1 0 2 14c0 8 13 23 13 23z"
             fill="${fill}" stroke="#fff" stroke-width="2.4"/>
       <circle cx="15" cy="14" r="5" fill="${dot}"/>
     </svg>`});
}

function drawMap(list){
  markers.clearLayers();
  if (ring){ map.removeLayer(ring); ring = null; }

  if (!showAll){
    ring = L.circle(centre,{radius:radius*1000, color:'#4DADE5', weight:1.4,
      opacity:.5, fillOpacity:.05, dashArray:'6,7'}).addTo(map);
  }

  // pin'en / crosshairet der definerer centrum
  L.marker(centre,{icon:pinIcon(atGps), zIndexOffset:950})
    .addTo(markers)
    .on('click', () => { if (!atGps) snapToGps(); });

  const pts = [];
  list.forEach(a => {
    const done = lockd(a.id), vis = seen(a.id);
    const bg = done ? '#3BD37F' : vis ? '#F2B740' : col(a.cat);
    L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],
      html:`<div style="width:18px;height:18px;border-radius:50%;background:${bg};
        border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.55)"></div>`
    })}).addTo(markers).on('click', () => openDetail(a.id));
    pts.push([a.lat,a.lng]);
  });

  if (showAll && pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[30,30]});
}

/* kortudsnittet følger radius */
function frameRadius(){
  if (showAll) return;
  const b = L.latLng(centre[0], centre[1]).toBounds(radius * 2000);
  map.fitBounds(b, {padding:[16,16], animate:true});
}

function movePin(p, onMe){
  centre = p; atGps = onMe;
  document.getElementById('pinBtn').classList.toggle('on', !onMe);
  render();
  frameRadius();
}
function snapToGps(){
  if (!gps){ toast('Appen kender endnu ikke din position'); return; }
  pinMode = false;
  document.getElementById('pinBtn').classList.remove('on');
  movePin(gps, true);
  toast('Flyttet til din position');
}

/* ---------- filtrering ---------- */
function currentList(){
  const q = query.trim().toLowerCase();
  return ATTRACTIONS
    .filter(a => !region || a.reg.includes(region))
    .filter(a => !onlyMissing || !(seen(a.id) || lockd(a.id)))
    .filter(a => !q || a.name.toLowerCase().includes(q)
                    || a.city.toLowerCase().includes(q)
                    || a.cat.toLowerCase().includes(q))
    .filter(a => showAll || q || distTo(a) <= radius)
    .sort((a,b) => distTo(a) - distTo(b));
}

function drawFilters(){
  const box = document.getElementById('filters');
  const bits = [];
  if (query.trim()) bits.push(['Søg: "'+query.trim()+'"', clearSearch]);
  if (region) bits.push(['Landsdel: '+region, () => { region=null; buildRegions(); render(); }]);
  if (onlyMissing) bits.push(['Kun manglende', () => {
    onlyMissing=false;
    const b=document.getElementById('onlyMissing');
    b.classList.remove('on'); b.textContent='Vis kun dem jeg mangler'; render(); }]);
  if (!atGps) bits.push(['Punkt på kort', snapToGps]);

  box.innerHTML = '';
  bits.forEach(([t,fn]) => {
    const c = document.createElement('div');
    c.className='fchip'; c.innerHTML = t + ' <b>×</b>'; c.onclick = fn;
    box.appendChild(c);
  });
}

/* ---------- liste ---------- */
function render(){
  const list = currentList();
  drawMap(list);
  drawFilters();

  const q = query.trim();
  document.getElementById('listTitle').textContent =
    q ? 'Søgeresultat' : atGps ? 'Attraktioner i området' : 'Nær punktet på kortet';
  document.getElementById('listCount').textContent =
    list.length + (showAll || q ? ' fundet' : ' · ' + radius + ' km');

  const tot = ATTRACTIONS.length;
  const done = ATTRACTIONS.filter(a => seen(a.id) || lockd(a.id)).length;
  document.getElementById('progress').textContent = done + ' af ' + tot + ' besøgt';

  const box = document.getElementById('list');
  if (!list.length){
    box.innerHTML = '<div class="empty">'
      + (q ? 'Ingen træffere på "'+q+'".' : 'Ingen attraktioner her.')
      + '<br>Træk radius længere ud, eller tryk 🌍 for at se alle 100.</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach(a => {
    const d = distTo(a);
    const done = lockd(a.id), vis = seen(a.id);
    const card = document.createElement('div');
    card.className='card';
    card.onclick = () => openDetail(a.id);
    card.innerHTML = `
      <div class="thumbwrap">
        <div class="thumb"></div>
        ${done||vis ? '<span class="badge-ok">✓</span>' : ''}
      </div>
      <div class="cardbody">
        <div class="nm">${a.name}</div>
        <div class="mt">${a.city}</div>
        <div class="tags">
          <span class="tag">${a.cat}</span>
          <span class="tag ${a.price === 'Fri adgang' ? 'free' : ''}">${a.price}</span>
        </div>
      </div>
      <div class="carddist">${d < 10 ? d.toFixed(1) : Math.round(d)} km</div>`;
    fillThumb(card.querySelector('.thumb'), a, false);
    frag.appendChild(card);
  });
  box.innerHTML = '';
  box.appendChild(frag);
}

/* ---------- detalje ---------- */
function openDetail(id){
  const a = ATTRACTIONS.find(x => x.id === id);
  current = a;
  document.getElementById('dName').textContent = a.name;
  document.getElementById('dChips').innerHTML =
    `<span class="chip">${a.cat}</span>` + a.reg.map(r=>`<span class="chip">${r}</span>`).join('');
  document.getElementById('dCity').textContent  = a.city;
  document.getElementById('dDist').textContent  = distTo(a).toFixed(1) + ' km';
  document.getElementById('dPrice').textContent = a.price;
  document.getElementById('dReg').textContent   = a.reg.join(' / ');

  const hw = document.getElementById('dHeroWrap');
  hw.innerHTML = '<div class="hero" id="dHero"></div>';
  fillThumb(document.getElementById('dHero'), a, true);

  document.getElementById('dRoute').href =
    `https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lng}`;
  const web = document.getElementById('dWeb');
  if (a.web){
    web.href = a.web;
    web.textContent = '🌐 Hjemmeside';
  } else {
    // ingen officiel side i datasættet: slå stedet op i Google Maps,
    // hvor åbningstider, priser og fotos som regel står
    web.href = 'https://www.google.com/maps/search/?api=1&query='
             + encodeURIComponent(a.name + ', ' + a.city);
    web.textContent = '📍 Slå op i Maps';
  }

  document.getElementById('dVisit').textContent =
    seen(a.id) ? '✓ Besøgt — fjern markering' : 'Markér som besøgt';
  drawGallery();
  openSheet('detSheet');
}
function drawGallery(){
  const a = current, g = document.getElementById('dGallery');
  g.innerHTML = pics(a.id).map((p,i) =>
    `<div><img src="${p.data}" onclick="delPhoto(${i})">
     <div class="lock">${p.geo ? '🔒 bekræftet' : p.date}</div></div>`).join('');
  document.getElementById('dGeoNote').textContent = lockd(a.id)
    ? '🔒 Bekræftet — dit foto blev taget inden for 150 m af stedet.'
    : 'Tag et foto mens du står der, så låser appen den som bekræftet besøgt.';
}
function delPhoto(i){
  const ps = pics(current.id); ps.splice(i,1);
  localStorage.setItem('p_'+current.id, JSON.stringify(ps));
  if (!ps.some(p=>p.geo)) localStorage.removeItem('g_'+current.id);
  drawGallery(); render();
}

/* ---------- foto ---------- */
async function handlePhoto(e){
  const f = e.target.files[0]; if (!f || !current) return;
  const a = current;
  let plat=null, plng=null;
  try{ const ex = await exifr.parse(f); if (ex && ex.latitude){ plat=ex.latitude; plng=ex.longitude; } }catch(_){}
  if (plat === null && gps){ plat = gps[0]; plng = gps[1]; }

  const rd = new FileReader();
  rd.onload = ev => {
    let ok=false, d=null;
    if (plat !== null){ d = km(a.lat,a.lng,plat,plng); ok = d <= 0.15; }
    const ps = pics(a.id);
    ps.push({data:ev.target.result, date:new Date().toLocaleDateString('da-DK'), geo:ok});
    try{ localStorage.setItem('p_'+a.id, JSON.stringify(ps)); }
    catch(err){ alert('Der er ikke plads til flere fotos i browserens lager.'); return; }
    if (ok){ localStorage.setItem('g_'+a.id,'1'); localStorage.setItem('v_'+a.id,'1'); }
    drawGallery(); render(); buildRegions(); buildStats();
    if (!ok) alert(d === null
      ? 'Fotoet er gemt, men appen kender ikke din position, så den er ikke bekræftet.'
      : 'Fotoet er gemt. Din position er ' + d.toFixed(1) + ' km fra ' + a.name
        + ', så den er ikke låst som bekræftet.');
  };
  rd.readAsDataURL(f);
  e.target.value = '';
}

/* ---------- indstillinger ---------- */
function buildRegions(){
  const box = document.getElementById('regions');
  box.innerHTML = '';
  REGIONS.forEach(r => {
    const tot = ATTRACTIONS.filter(a => a.reg.includes(r)).length;
    const dn  = ATTRACTIONS.filter(a => a.reg.includes(r) && (seen(a.id)||lockd(a.id))).length;
    const b = document.createElement('button');
    b.className = 'regbtn' + (region === r ? ' on' : '');
    b.innerHTML = r + '<small>' + dn + ' / ' + tot + '</small>';
    b.onclick = () => { region = (region === r) ? null : r; buildRegions(); render(); };
    box.appendChild(b);
  });
}
function buildStats(){
  const tot = ATTRACTIONS.length;
  const dn  = ATTRACTIONS.filter(a => seen(a.id)||lockd(a.id)).length;
  const lk  = ATTRACTIONS.filter(a => lockd(a.id)).length;
  document.getElementById('statFacts').innerHTML =
    `<div class="fact"><div class="k">Besøgt</div><div class="v">${dn} / ${tot}</div></div>
     <div class="fact"><div class="k">Bekræftet med foto</div><div class="v">${lk}</div></div>`;
}

/* ---------- ark ---------- */
function openSheet(id){ document.getElementById(id).classList.add('open'); }
function closeSheet(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeSheet(b.dataset.close));
document.querySelectorAll('.sheet').forEach(s =>
  s.onclick = e => { if (e.target === s) closeSheet(s.id); });

/* ---------- radius ---------- */
const slider = document.getElementById('radius');
const sliderBar = document.getElementById('radiusBar');
function setRadius(v){
  radius = +v;
  document.getElementById('radiusOut').textContent = radius + ' km';
  render();
  frameRadius();
}
slider.addEventListener('input',  e => setRadius(e.target.value));
slider.addEventListener('change', e => setRadius(e.target.value));

/* ---------- knapper ---------- */
document.getElementById('allBtn').onclick = function(){
  showAll = !showAll;
  this.classList.toggle('on', showAll);
  slider.disabled = showAll;
  sliderBar.classList.toggle('off', showAll);
  render();
  if (!showAll) frameRadius();
};
document.getElementById('locBtn').onclick = snapToGps;
document.getElementById('pinBtn').onclick = function(){
  pinMode = !pinMode;
  this.classList.toggle('on', pinMode);
  if (pinMode) toast('Tryk et sted på kortet — punktet flyttes dertil', true);
  else hideToast();
};
document.getElementById('setBtn').onclick = () => {
  buildRegions(); buildStats(); openSheet('setSheet');
};
document.getElementById('clearReg').onclick = () => { region=null; buildRegions(); render(); };
document.getElementById('onlyMissing').onclick = function(){
  onlyMissing = !onlyMissing;
  this.classList.toggle('on', onlyMissing);
  this.textContent = onlyMissing ? '✓ Viser kun dem jeg mangler' : 'Vis kun dem jeg mangler';
  render();
};

/* ---------- søgning ---------- */
const searchRow = document.getElementById('searchRow');
const searchInp = document.getElementById('search');
document.getElementById('searchBtn').onclick = function(){
  const on = !searchRow.classList.contains('show');
  searchRow.classList.toggle('show', on);
  this.classList.toggle('on', on);
  if (on) setTimeout(() => searchInp.focus(), 60);
  else clearSearch();
};
function clearSearch(){
  query = ''; searchInp.value = '';
  searchRow.classList.remove('show');
  document.getElementById('searchBtn').classList.remove('on');
  render();
}
document.getElementById('searchClose').onclick = clearSearch;
searchInp.addEventListener('input', e => { query = e.target.value; render(); });

/* ---------- foto/besøgt ---------- */
document.getElementById('reloadImgs').onclick = async function(){
  localStorage.removeItem('wikiimg');
  PHOTOS = {};
  this.textContent = 'Henter…';
  this.disabled = true;
  render();
  await loadPhotos();
  this.textContent = 'Hent billeder forfra';
  this.disabled = false;
  const n = ATTRACTIONS.filter(a => imgFor(a)).length;
  toast(n + ' af ' + ATTRACTIONS.length + ' har nu et billede');
};

document.getElementById('dImg').onclick = () => {
  const a = current;
  const own = OWN();
  const nu = own[a.id] || '';
  const svar = prompt(
    'Indsæt en billed-URL til ' + a.name + '.\n\n'
    + 'Find billedet på f.eks. Wikipedia, Google Maps eller turistsiden, '
    + 'højreklik og kopiér billedadressen.\n'
    + 'Lad feltet stå tomt for at bruge det automatisk hentede igen.', nu);
  if (svar === null) return;
  const v = svar.trim();
  if (v) own[a.id] = v; else delete own[a.id];
  try{ localStorage.setItem('ownimg', JSON.stringify(own)); }
  catch(e){ toast('Kunne ikke gemme'); return; }
  openDetail(a.id); render(); noteImages();
  toast(v ? 'Billede opdateret' : 'Eget billede fjernet');
};

document.getElementById('dDrop').onclick = () => document.getElementById('camInput').click();
document.getElementById('camInput').onchange = handlePhoto;
document.getElementById('dVisit').onclick = () => {
  const id = current.id;
  if (seen(id)){ localStorage.removeItem('v_'+id); localStorage.removeItem('g_'+id); }
  else localStorage.setItem('v_'+id,'1');
  document.getElementById('dVisit').textContent =
    seen(id) ? '✓ Besøgt — fjern markering' : 'Markér som besøgt';
  render(); drawGallery(); buildRegions(); buildStats();
};

/* ---------- start ---------- */
initMap();
render();
buildRegions();
buildStats();
loadPhotos();

if (navigator.geolocation){
  navigator.geolocation.watchPosition(p => {
    const np = [p.coords.latitude, p.coords.longitude];
    const moved = !gps || km(gps[0],gps[1],np[0],np[1]) > 0.15;
    gps = np;
    if (atGps) centre = np;
    if (firstFix){ firstFix = false; movePin(np, true); return; }
    if (moved && atGps) render();
  }, () => {}, {enableHighAccuracy:true, maximumAge:20000, timeout:20000});
}
