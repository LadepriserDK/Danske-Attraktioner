<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Danske Attraktioner · Stampbog App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A2F51">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0A2F51;
  --panel: #102A47;
  --panel-2: #153252;
  --line: #224466;
  --text: #E8F0F8;
  --muted: #8FA6BB;
  --accent: #4DADE5;
  --success: #3BD37F;
  --warn: #F2B740;
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

header {
  padding: 14px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 1200;
}

.logo {
  font-weight: 700;
  font-size: 17px;
}

.spacer { flex: 1; }

.header-btn {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  transition: all .15s;
}

.header-btn:active {
  background: var(--accent);
  color: var(--bg);
}

.container {
  display: flex;
  flex: 1;
  min-height: 0;
}

#map {
  flex: 1;
  background: #0D3D5C;
}

.sidebar {
  width: 340px;
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

@media (max-width: 768px) {
  .sidebar { display: none; }
}

.sidebar-header {
  padding: 14px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

.region-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.region-tab {
  padding: 10px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all .15s;
}

.region-tab.active {
  background: var(--accent);
  color: var(--bg);
}

.region-tab .count {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}

.search-box {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

#searchInput {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-2);
  color: var(--text);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
}

.range-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.range-control label {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.range-control input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
}

.range-control output {
  font-size: 13px;
  font-weight: 600;
  min-width: 40px;
  text-align: right;
}

.sidebar-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.attraction-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.attraction-item {
  padding: 12px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all .15s;
  position: relative;
}

.attraction-item:active {
  border-color: var(--accent);
}

.att-name {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 4px;
}

.att-meta {
  display: flex;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
}

.att-check {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 20px;
  height: 20px;
  border: 1px solid var(--success);
  border-radius: 4px;
  background: rgba(59, 211, 127, .15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

.empty-state {
  padding: 30px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 2000;
}

.modal.show {
  display: flex;
  align-items: flex-end;
}

.modal-content {
  width: 100%;
  background: var(--panel);
  border-radius: 16px 16px 0 0;
  padding: 20px;
  max-height: 85vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text);
  font-size: 24px;
  cursor: pointer;
}

.modal-image {
  width: 100%;
  height: 200px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.info-card {
  background: var(--panel-2);
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
}

.info-label {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 4px;
}

.info-value {
  font-weight: 600;
  font-size: 13px;
}

.photo-gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.photo-item {
  width: 100%;
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-upload {
  width: 100%;
  padding: 30px 16px;
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  background: rgba(77, 173, 229, .05);
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
}

.action-buttons {
  display: flex;
  gap: 8px;
}

.action-button {
  flex: 1;
  padding: 12px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}

.action-button.secondary {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line);
}
</style>
</head>
<body>

<header>
  <div class="logo">🗺️ Danske Attraktioner</div>
  <div class="spacer"></div>
  <button class="header-btn" onclick="showStats()">📊 Status</button>
</header>

<div class="container">
  <div id="map"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="region-tabs" id="regionTabs"></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Søg..." />
      </div>
      <div class="range-control">
        <label>Radius:</label>
        <input type="range" id="radiusSlider" min="5" max="100" value="25" step="5" />
        <output id="radiusOutput">25 km</output>
      </div>
    </div>

    <div class="sidebar-content">
      <div class="attraction-list" id="attractionList">
        <div class="empty-state">Indlæser...</div>
      </div>
    </div>
  </aside>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle" style="margin: 0; font-size: 16px; font-weight: 700;"></h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <img id="modalImage" class="modal-image" alt="">

    <div style="margin-bottom: 16px;">
      <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px;">Detaljer</div>
      <div class="info-grid">
        <div class="info-card">
          <div class="info-label">By</div>
          <div class="info-value" id="modalCity">-</div>
        </div>
        <div class="info-card">
          <div class="info-label">Region</div>
          <div class="info-value" id="modalRegion">-</div>
        </div>
        <div class="info-card">
          <div class="info-label">Afstand</div>
          <div class="info-value" id="modalDistance">-</div>
        </div>
        <div class="info-card">
          <div class="info-label">Kategori</div>
          <div class="info-value" id="modalCategory">-</div>
        </div>
      </div>
    </div>

    <div style="margin-bottom: 16px;">
      <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px;">Mine Fotos</div>
      <div class="photo-gallery" id="photoGallery"></div>
      <div class="photo-upload" id="photoUpload">📸 Tag foto med GPS-data</div>
    </div>

    <div class="action-buttons">
      <button class="action-button" id="routeBtn">🗺️ Rutevejledning</button>
      <button class="action-button secondary" onclick="closeModal()">Luk</button>
    </div>
  </div>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment">

const REGIONS = ['Jylland', 'Fyn', 'Sjælland', 'Øerne'];

let map, currentAttractionId = null;
let userLocation = [56.2639, 9.5018];
let filteredAttractions = [...ATTRACTIONS];
let selectedRegion = null;
let radiusKm = 25;

window.addEventListener('DOMContentLoaded', () => {
  initMap();
  initUI();
  renderAttractions();
  
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLocation = [pos.coords.latitude, pos.coords.longitude];
        updateMap();
        renderAttractions();
      }
    );
  }
});

function initMap() {
  map = L.map('map').setView(userLocation, 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);
}

function updateMap() {
  map.eachLayer(layer => {
    if (layer instanceof L.Marker || layer instanceof L.Circle) {
      map.removeLayer(layer);
    }
  });

  L.circle(userLocation, {
    radius: radiusKm * 1000,
    color: '#4DADE5',
    weight: 1,
    opacity: 0.3,
    fillOpacity: 0.05
  }).addTo(map);

  filteredAttractions.forEach(att => {
    const dist = haversine(userLocation[0], userLocation[1], att.lat, att.lng);
    
    if (dist <= radiusKm) {
      const isVisited = localStorage.getItem(`visited_${att.id}`);
      const hasGeoPhoto = localStorage.getItem(`geo_locked_${att.id}`);
      
      L.marker([att.lat, att.lng], {
        icon: L.divIcon({
          html: `<div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: ${hasGeoPhoto ? '#3BD37F' : isVisited ? '#F2B740' : '#4DADE5'}; border-radius: 50%; border: 3px solid white; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.3);">${att.image}</div>`,
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        })
      }).addTo(map).on('click', () => openModal(att.id));
    }
  });
}

function initUI() {
  const regionTabs = document.getElementById('regionTabs');
  REGIONS.forEach(region => {
    const count = ATTRACTIONS.filter(a => a.regions.includes(region)).length;
    const visited = ATTRACTIONS.filter(a => a.regions.includes(region) && localStorage.getItem(`visited_${a.id}`)).length;
    
    const btn = document.createElement('button');
    btn.className = 'region-tab';
    btn.innerHTML = `${region}<span class="count">${visited}/${count}</span>`;
    btn.onclick = () => filterByRegion(region, btn);
    regionTabs.appendChild(btn);
  });

  document.getElementById('searchInput').addEventListener('input', () => applyFilters());

  document.getElementById('radiusSlider').addEventListener('input', e => {
    radiusKm = parseInt(e.target.value);
    document.getElementById('radiusOutput').textContent = radiusKm + ' km';
    updateMap();
    renderAttractions();
  });

  document.getElementById('photoUpload').addEventListener('click', () => {
    document.getElementById('cameraInput').click();
  });

  document.getElementById('cameraInput').addEventListener('change', e => {
    handlePhotoUpload(e);
  });
}

function filterByRegion(region, btn) {
  document.querySelectorAll('.region-tab').forEach(b => b.classList.remove('active'));
  
  if (selectedRegion === region) {
    selectedRegion = null;
  } else {
    selectedRegion = region;
    btn.classList.add('active');
  }
  
  applyFilters();
}

function applyFilters() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  
  filteredAttractions = ATTRACTIONS.filter(att => {
    const matchSearch = !searchTerm || att.name.toLowerCase().includes(searchTerm) || att.city.toLowerCase().includes(searchTerm);
    const matchRegion = !selectedRegion || att.regions.includes(selectedRegion);
    
    return matchSearch && matchRegion;
  });
  
  renderAttractions();
  updateMap();
}

function renderAttractions() {
  const list = document.getElementById('attractionList');
  
  const sortedAtts = [...filteredAttractions].sort((a, b) => {
    const distA = haversine(userLocation[0], userLocation[1], a.lat, a.lng);
    const distB = haversine(userLocation[0], userLocation[1], b.lat, b.lng);
    return distA - distB;
  });
  
  const inRadius = sortedAtts.filter(att => {
    const dist = haversine(userLocation[0], userLocation[1], att.lat, att.lng);
    return dist <= radiusKm;
  });
  
  if (inRadius.length === 0) {
    list.innerHTML = '<div class="empty-state">Ingen attraktioner inden for radius.</div>';
    return;
  }
  
  list.innerHTML = inRadius.map(att => {
    const isVisited = localStorage.getItem(`visited_${att.id}`);
    const hasGeoPhoto = localStorage.getItem(`geo_locked_${att.id}`);
    const dist = haversine(userLocation[0], userLocation[1], att.lat, att.lng);
    
    return `
      <div class="attraction-item" onclick="openModal('${att.id}')" style="position: relative;">
        <div class="att-name">${att.image} ${att.name}</div>
        <div class="att-meta">
          <span>${att.city}</span>
          <span>${dist.toFixed(1)} km</span>
        </div>
        ${hasGeoPhoto ? '<div style="position: absolute; top: 8px; left: 8px; background: var(--success); color: white; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;">🔒 Geo-låst</div>' : ''}
        ${isVisited && !hasGeoPhoto ? '<div class="att-check">✓</div>' : ''}
      </div>
    `;
  }).join('');
}

function openModal(id) {
  currentAttractionId = id;
  const att = ATTRACTIONS.find(a => a.id === id);
  
  document.getElementById('modalTitle').textContent = att.name;
  
  const dist = haversine(userLocation[0], userLocation[1], att.lat, att.lng);
  document.getElementById('modalCity').textContent = att.city;
  document.getElementById('modalRegion').textContent = att.regions.join(' / ');
  document.getElementById('modalDistance').textContent = dist.toFixed(1) + ' km';
  document.getElementById('modalCategory').textContent = att.category;
  
  document.getElementById('modalImage').src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 200'><rect fill='%23153252' width='400' height='200'/><text x='200' y='100' font-size='100' text-anchor='middle' dominant-baseline='central'>${att.image}</text></svg>`;
  
  document.getElementById('routeBtn').onclick = () => {
    const url = `https://www.google.com/maps/dir/?api=1&destination=${att.lat},${att.lng}&origin=${userLocation[0]},${userLocation[1]}`;
    window.open(url, '_blank');
  };
  
  renderPhotos();
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  currentAttractionId = null;
}

async function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file || !currentAttractionId) return;
  
  const att = ATTRACTIONS.find(a => a.id === currentAttractionId);
  
  try {
    const exif = await exifr.parse(file);
    const photoLat = exif?.latitude;
    const photoLng = exif?.longitude;
    
    const reader = new FileReader();
    reader.onload = (evt) => {
      const photo = {
        data: evt.target.result,
        date: new Date().toLocaleDateString('da-DK'),
        lat: photoLat,
        lng: photoLng,
        geoLocked: false
      };
      
      if (photoLat && photoLng) {
        const dist = haversine(att.lat, att.lng, photoLat, photoLng);
        if (dist <= 0.1) {
          photo.geoLocked = true;
          localStorage.setItem(`geo_locked_${currentAttractionId}`, 'true');
        }
      }
      
      const photos = JSON.parse(localStorage.getItem(`photos_${currentAttractionId}`) || '[]');
      photos.push(photo);
      localStorage.setItem(`photos_${currentAttractionId}`, JSON.stringify(photos));
      
      renderPhotos();
      renderAttractions();
      updateMap();
    };
    reader.readAsDataURL(file);
  } catch (err) {
    alert('⚠️ Ingen GPS-data i billedet.');
  }
  
  e.target.value = '';
}

function renderPhotos() {
  const gallery = document.getElementById('photoGallery');
  const photos = JSON.parse(localStorage.getItem(`photos_${currentAttractionId}`) || '[]');
  
  gallery.innerHTML = photos.map((photo, idx) => `
    <div class="photo-item">
      <img src="${photo.data}" alt="Foto ${idx + 1}" style="cursor: pointer;" onclick="deletePhoto(${idx})">
    </div>
  `).join('');
}

function deletePhoto(idx) {
  const photos = JSON.parse(localStorage.getItem(`photos_${currentAttractionId}`) || '[]');
  photos.splice(idx, 1);
  localStorage.setItem(`photos_${currentAttractionId}`, JSON.stringify(photos));
  renderPhotos();
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.asin(Math.sqrt(a));
}

function showStats() {
  const total = ATTRACTIONS.length;
  const visited = ATTRACTIONS.filter(a => localStorage.getItem(`visited_${a.id}`)).length;
  const geoLocked = ATTRACTIONS.filter(a => localStorage.getItem(`geo_locked_${a.id}`)).length;
  
  alert(`📊 Din progress

Total besøgt: ${visited}/${total}
🔒 Geo-låst: ${geoLocked}

${REGIONS.map(r => {
    const rTotal = ATTRACTIONS.filter(a => a.regions.includes(r)).length;
    const rVisited = ATTRACTIONS.filter(a => a.regions.includes(r) && localStorage.getItem(`visited_${a.id}`)).length;
    return `${r}: ${rVisited}/${rTotal}`;
  }).join('\n')}`);
}
